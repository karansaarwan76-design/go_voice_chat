name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Install Dependencies
        # Agar pubspec.yaml ek folder ke andar hai, toh hum yeh find command use karenge
        run: |
          find . -name "pubspec.yaml" -execdir flutter pub get \;

      - name: Build APK
        # Yeh command us folder mein jahan pubspec mila, wahan APK build karega
        run: |
          find . -name "pubspec.yaml" -execdir flutter build apk --release \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: "**/app-release.apk"
  
